<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
  </head>

  <body>
    <div class="header">
      <div class="logo">
        <div class="app-logo" aria-hidden="true">
          <img src="./icons/icon32.png" alt="" />
        </div>
        <div>
          <div class="logo-name">SocialFocus</div>
          <div class="logo-sub">Feed + social blocker</div>
        </div>
      </div>

      <div class="status-badge active" id="statusBadge">
        <div class="status-dot active" id="statusDot"></div>
        <span id="statusText">Active</span>
      </div>
    </div>

    <div class="master-toggle" id="masterToggle">
      <div>
        <div class="toggle-label">Reels / Feed Protection</div>
        <div class="toggle-value" id="toggleLabel">Blocking enabled</div>
      </div>
      <label
        class="switch"
        aria-label="Enable or disable reels and feed protection"
      >
        <input type="checkbox" id="mainToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section-label">Blocking mode</div>

    <label class="mode-card selected" id="reelsModeCard">
      <input type="radio" name="blockMode" value="reels" id="reelsMode" />
      <div>
        <div class="mode-title">Only block reels / feeds</div>
        <div class="mode-desc">
          Keep useful pages like messages and profiles.
        </div>
      </div>
    </label>

    <label class="mode-card" id="fullModeCard">
      <input type="radio" name="blockMode" value="full" id="fullMode" />
      <div>
        <div class="mode-title">Block full social media</div>
        <div class="mode-desc">
          Stop opening supported social platforms completely.
        </div>
      </div>
    </label>

    <div class="timer-card">
      <div class="card-label">Focus timer lock</div>
      <div class="mode-title">Lock focus mode</div>

      <div class="timer-row">
        <input
          class="timer-input"
          id="timerMinutes"
          type="number"
          min="1"
          max="1440"
          step="1"
          value="30"
          aria-label="Timer minutes"
        />
        <button class="btn primary" id="startTimerBtn">Start timer</button>
      </div>

      <div class="timer-status" id="timerStatus">No active lock.</div>
    </div>

    <div class="section-label">Platforms</div>
