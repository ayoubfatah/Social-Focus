<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SocialFocus Blocked</title>
    <style>
      :root {
        --bg: #0d0d0f;
        --bg2: #18181c;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f0f0f0;
        --muted: #9a9a9a;
        --green: #34d399;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #202027 0, var(--bg) 45%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        width: min(92vw, 460px);
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .icon {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        background: rgba(52, 211, 153, 0.12);
        color: var(--green);
        font-size: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .small {
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">✦</div>
      <h1>Blocked by SocialFocus</h1>
      <p>This social platform is locked during your focus session.</p>
      <p class="small">Open the extension popup to check the timer.</p>
    </main>
  </body>
</html>
